    <style>
        /* CSS Reset */
        * {
            margin: 0;

.admission-notice {
        background-color: #e74c3c;
        color: white;
        padding: 10px 0;
        text-align: center;
        position: relative;
        animation: slideIn 0.5s ease-out;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
    }
    
    .notice-content {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    
    .nepali {
        font-size: 0.9em;
    }
    
    .close-notice {
        font-size: 20px;
        font-weight: bold;
        padding: 0 10px;
    }
    
    .close-notice:hover {
        color: #f1c40f;
    }
    
    @keyframes slideIn {
        from { transform: translateY(-100%); }
        to { transform: translateY(0); }

    <script>
        // Khalti payment configuration
        var khaltiConfig = {
            "publicKey": "test_public_key_XXXXXXXXXXXXXXXXXXXX", // Replace with your actual public key
            "productIdentity": "School Fees",
            "productName": "Miniland Academy Fees",
            "productUrl": window.location.href,
            "paymentPreference": [
                "KHALTI",
                "EBANKING",
                "MOBILE_BANKING",
                "CONNECT_IPS",
                "SCT"
            ],
            "eventHandler": {
                onSuccess (payload) {
                    console.log(payload);
                    // Here you can redirect to success page or show message
                    alert("Payment successful! Transaction ID: " + payload.idx);
                    
                    // In a real implementation, you would verify this payment with your backend
                    // fetch('/verify-payment', {
                    //     method: 'POST',
                    //     headers: {
                    //         'Content-Type': 'application/json',
                    //     },
                    //     body: JSON.stringify(payload)
                    // })
                },
                onError (error) {
                    console.log(error);
                    alert("Payment failed: " + error.message);
                },
                onClose () {
                    console.log('Payment window closed');
                }
            }
        };

        // Initialize Khalti Checkout
        var khaltiCheckout = new KhaltiCheckout(khaltiConfig);
        
        // Khalti Button click handler
        document.getElementById("khalti-button").onclick = function () {
            // For demo purposes, using 1000 NPR (100000 paisa)
            // In real implementation, you might get this from a form or database
            khaltiCheckout.show({amount: 100000});
        }

        // eSewa Payment Configuration
        function payWithEsewa() {
            var path = "https://uat.esewa.com.np/epay/main";
            var params = {
                amt: 1000, // Amount in NPR
                psc: 0,    // Service charge
                pdc: 0,    // Delivery charge
                txAmt: 0,  // Tax amount
                tAmt: 1000, // Total amount
                pid: "school_fee_" + new Date().getTime(), // Product ID
                scd: "EPAYTEST", // Merchant code (use your actual code in production)
                su: window.location.href + "?payment=success", // Success URL
                fu: window.location.href + "?payment=failed"   // Failure URL
            };

            // Submit form to eSewa
            var form = document.createElement("form");
            form.setAttribute("method", "POST");
            form.setAttribute("action", path);
            
            for(var key in params) {
                var hiddenField = document.createElement("input");
                hiddenField.setAttribute("type", "hidden");
                hiddenField.setAttribute("name", key);
                hiddenField.setAttribute("value", params[key]);
                form.appendChild(hiddenField);
            }
            
            document.body.appendChild(form);
            form.submit();
        }

        // eSewa Button click handler
        document.getElementById("esewa-button").onclick = payWithEsewa;

        // Check for payment success/failure in URL parameters
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const paymentStatus = urlParams.get('payment');
            
            if(paymentStatus === 'success') {
                alert('eSewa Payment Successful!');
            } else if(paymentStatus === 'failed') {
                alert('eSewa Payment Failed. Please try again.');
            }
        };
    document.querySelector('.admission-notice').addEventListener('click', function(e) {
        if(e.target.classList.contains('close-notice')) {
            this.style.display = 'none';
            // Optional: Store in localStorage to remember user preference
            localStorage.setItem('admissionNoticeClosed', 'true');
        }
    });
    
    // Optional: Check localStorage on page load
    window.addEventListener('DOMContentLoaded', function() {
        if(localStorage.getItem('admissionNoticeClosed') === 'true') {
            document.querySelector('.admission-notice').style.display = 'none';
        }
    });
</script>
